<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prjC4 authentication</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">TEAM prjC4</p>
    <h1>Admin sign in</h1>
    <p>Use your administrator credentials to continue.</p>
    <form id="login-form">
      <label>Username<input id="username" name="username" autocomplete="username" required></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
      <button>Login</button>
    </form>
  </main>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
